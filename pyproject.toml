[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "codebot"
version = "0.1.0"
description = "Motor RAG sobre bases de código com interface"
authors = [{name = "Eugênio Quintas/equintas_27"}]
requires-python = ">=3.10"
dependencies = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "Streamlit>=1.30.0",
    "click>=8.1.0",
    "torch>=2.0.0",
    "PyMuPDF>=1.24.0"
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "data"
]